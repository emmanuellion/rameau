name: Release

# Push a tag like v0.2.0 (matching the version in Cargo.toml) on a commit of main to build every
# platform and publish a GitHub release. Run it by hand (main or develop) to only build the
# packages, downloadable from the run page: nothing is published. Releases come from main only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Build jobs run third-party code (crates, appimagetool): read-only token. Only the release job writes.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: macos-universal, os: macos-latest }
          - { target: linux-x86_64, os: ubuntu-22.04, arch: x86_64 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm, arch: aarch64 }
          - { target: windows-x86_64, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # The tagged commit must be on main (identical to it, or behind it).
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)
            if [[ "$status" != identical && "$status" != behind ]]; then
              echo "::error::Le tag $GITHUB_REF_NAME n'est pas sur main : les releases se font depuis main"
              exit 1
            fi
          elif [[ "$GITHUB_REF" != refs/heads/main && "$GITHUB_REF" != refs/heads/develop ]]; then
            echo "::error::Les paquets se construisent depuis main ou develop, pas depuis $GITHUB_REF_NAME"
            exit 1
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de Cargo.toml"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: scripts/linux-deps.sh

      # Nothing is packaged, let alone published, from code whose tests fail on that system.
      - name: Tests
        run: cargo test --release --locked

      - name: Build macOS (Apple Silicon + Intel)
        if: runner.os == 'macOS'
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/rameau \
            target/aarch64-apple-darwin/release/rameau target/x86_64-apple-darwin/release/rameau
          scripts/package-macos.sh dist/rameau "$VERSION" dist

      - name: Build Linux
        if: runner.os == 'Linux'
        run: |
          cargo build --release --locked
          scripts/package-linux.sh target/release/rameau "$VERSION" "${{ matrix.arch }}" dist

      - name: Build Windows
        if: runner.os == 'Windows'
        run: |
          cargo build --release --locked
          mkdir -p dist/pkg
          cp target/release/rameau.exe LICENSE README.md dist/pkg/
          pwsh -Command "Compress-Archive -Path dist/pkg/* -DestinationPath dist/rameau-$VERSION-windows-x86_64.zip"
          # Installer and automatic updates (Velopack, same version as the velopack crate): the setup,
          # plus the full package and releases.win.json that installed copies read from the release.
          # shortcut: full packages only (~16 MB per update); download the previous release before
          # packing (vpk download github) to also publish deltas.
          dotnet tool install -g vpk --version 1.2.161
          vpk pack --packId Rameau --packVersion "$VERSION" --packDir dist/pkg --mainExe rameau.exe --runtime win-x64 --packTitle Rameau --packAuthors "Emmanuel Lion" --icon packaging/windows/rameau.ico --outputDir dist/velopack
          mv dist/velopack/Rameau-win-Setup.exe "dist/rameau-$VERSION-windows-x86_64-setup.exe"
          # Capital R: the release job's renaming (rameau-<version>-*) leaves the name the feed points to.
          mv "dist/velopack/Rameau-$VERSION-full.nupkg" dist/velopack/releases.win.json dist/
          test -s "dist/rameau-$VERSION-windows-x86_64-setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: rameau-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.zip
            dist/*.exe
            dist/*.nupkg
            dist/releases.*.json
          if-no-files-found: error

  release:
    name: GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Version-free names: releases/latest/download/rameau-macos-universal.dmg (used by the website)
      # always gives the newest version.
      - name: Stable file names
        run: |
          v="${GITHUB_REF_NAME#v}"
          cd dist && for f in rameau-"$v"-*; do mv "$f" "${f/-$v/}"; done
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Rameau $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            --generate-notes \
            --verify-tag
