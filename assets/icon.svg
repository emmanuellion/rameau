<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#252b3b"/>
      <stop offset="1" stop-color="#12141a"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Lanes 150 apart (362, 512, 662); each fork leaves its parent from a straight stretch,
       with the same S-curve. Children first so the parent line covers the joint. -->
  <g fill="none" stroke-width="54" stroke-linecap="round">
    <path d="M512 520 C512 450 662 450 662 380" stroke="#7bd88f"/>
    <path d="M362 700 C362 630 512 630 512 560 V320" stroke="#f0719b"/>
    <path d="M362 790 V236" stroke="#5ab0f6"/>
  </g>
  <g stroke="#12141a" stroke-width="16">
    <circle cx="362" cy="236" r="54" fill="#5ab0f6"/>
    <circle cx="362" cy="790" r="54" fill="#5ab0f6"/>
    <circle cx="512" cy="320" r="54" fill="#f0719b"/>
    <circle cx="662" cy="380" r="54" fill="#7bd88f"/>
  </g>
</svg>
